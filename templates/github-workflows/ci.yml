name: CI

# 流水线的质量闸门：dispatch 每次 push、review 合并前的 PR 都会触发。
# change-review 在最新 feature SHA 上跑同样的三件套与合并前 Verify；
# 本 workflow 可配置为 required check。建议同时开启 auto-merge，
# checks pending 时自动化等待通过后再合并，不绕过 branch protection。

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'hotfix/**'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
