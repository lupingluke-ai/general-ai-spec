name: Auto Merge PRs

# Non-draft PRs have GitHub auto-merge enabled with merge commits.
# Draft PRs (created by change-propose) are left open for dispatch runner (Codex Automation / `/loop` / cron / GH Actions).
# Review skill marks PR as Ready; GitHub performs the actual merge after required checks pass.

on:
  pull_request:
    types: [synchronize, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Enable auto-merge
        run: gh pr merge "$PR_NUMBER" --auto --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
