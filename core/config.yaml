# OpenSpec Configuration — 通用治理规则
# 技术栈特定规则由 stacks/*/config-ext.yaml 补充

schema: spec-driven

context: |
  Refer to openspec/project.md for the authoritative project baseline.
  This project uses OpenSpec for specification governance and fractal
  documentation (_DIR.md + @input/@output/@pos) for code documentation.
  Specs and tasks must respect the fact that the repo evolves incrementally.

  Fractal Documentation rules:
  - every touched directory must keep an up-to-date _DIR.md
  - key source files must keep @input/@output/@pos header comments
  - documentation updates are part of implementation, not a follow-up task

task-types:
  # 4 种任务类型的命名与治理规则
  # 所有 skill 从 change-id 前缀推导 branch-prefix（零 I/O 字符串判断）
  # 粒度拆分由 module-designer 在 /design 阶段与用户对话确定，propose 不再二次检查
  feature:
    change-id-prefix: ""              # 无前缀
    branch-prefix: "feat/"
    commit-type: "feat"
    pr-type: "feat"
    prd: "full"                       # templates/prd.md.tmpl
    delta-specs: "required"
    flow: "standard"                  # /prd → propose → dispatch → review
    trailer: "Backlog-Ref"
  bug:
    change-id-prefix: "fix-"
    branch-prefix: "fix/"
    commit-type: "fix"
    pr-type: "fix"
    prd: "lite"                       # templates/prd-lite.md.tmpl
    delta-specs: "optional"           # 通常为空或 ADDED 回归场景
    flow: "standard"
    trailer: "Backlog-Ref"
  chore:
    change-id-prefix: "chore-"
    branch-prefix: "chore/"
    commit-type: "chore"              # 开发者 commit 可用 refactor/build/ci/perf/docs
    pr-type: "chore"
    prd: "lite"
    delta-specs: "optional"           # 通常为空
    flow: "standard"
    trailer: "Backlog-Ref"
  hotfix:
    change-id-prefix: "hotfix-"
    branch-prefix: "hotfix/"
    commit-type: "fix"
    pr-type: "fix"
    prd: "lite"                       # 与 bug 一致：Lite PRD
    delta-specs: "optional"           # 与 bug 一致
    flow: "standard"                  # 走完整流程，不特殊化
    trailer: "Backlog-Ref"
    # 语义：hotfix = 紧急线上修复，仅通过 branch 前缀区分，流程与 bug 完全一致

rules:
  prd:
    - PRD 是产品级文档，存放在 product/prd/PRD-NNN.md
    - 编号与 backlog ID 对应（B-003 → PRD-003）
    - 状态流转：draft → reviewing → approved → superseded
    - PRD 回答 what & why，proposal 回答 how，职责分离
    - type=feature 使用 Full PRD（templates/prd.md.tmpl）：含用户故事、Must Have / Nice to Have / Out of Scope、验收标准
    - type=bug/chore/hotfix 使用 Lite PRD（templates/prd-lite.md.tmpl）：保留 Must Have（最少 1 条）和 AC（≥ delta specs 场景数）
    - PRD 必须用户 approved 后才能进入 propose
    - PRD 不随 change 归档，长期保留在 product/prd/
    - PRD frontmatter 必须包含 type 字段（feature | bug | chore | hotfix）

  backlog:
    - product/backlog.md 是所有开发的源头，按模块分节
    - 每个条目有唯一 ID（格式 B-NNN）、type（feature/bug/chore/hotfix）、阶段、关联 change-id
    - 阶段流转（所有类型统一）：idea → exploring → proposed → done
    - exploring 时生成 PRD，关联 PRD-NNN（由 prd-writer 写入）
    - propose 时更新为 proposed 并关联 change-id（由 change-propose 写入）
    - archive 时更新为 done（由 change-review 写入）
    - 执行中 / 审查中的细粒度状态由 tasks.md YAML 头的 status 字段承担（draft / ready / executing / review / done），不在 backlog.md 冗余反映——dispatch 不碰 main 治理层
    - type 不可变：需要修改 type 时关闭旧条目，新开 B-NNN
    - change-id 前缀规则详见 task-types 小节

  proposal:
    - 必须包含 Intent、Scope、Approach
    - 必须引用 backlog ID（如 B-001），关联产品需求
    - 必须引用 PRD ID（如 PRD-001），从 PRD 的用户故事和功能需求出发
    - 说明本次变更是在"已有基线之上新增能力"还是"修正基线"
    - 涉及目录结构调整时，标明需要更新的 _DIR.md 和 project.md 章节
    - 涉及环境变量变更时，列出新增变量、用途和默认本地配置策略
    - 标注 Breaking Changes
    - 估算复杂度：S / M / L / XL

  specs:
    - 使用 Given/When/Then 描述场景
    - 需求使用 SHALL / MUST / SHOULD 术语
    - 每个需求至少覆盖一个正常场景和一个异常或边界场景
    - change 内的 delta specs 使用 ADDED/MODIFIED/REMOVED 标记
    - MODIFIED 必须注明之前的行为；REMOVED 必须注明移除原因
    - 归档时 delta specs 合并到 openspec/specs/ 对应领域文件

  design:
    - 包含 Technical Approach
    - 说明新增或修改的目录、文件和脚本
    - 列出需要新增或更新的 _DIR.md 清单
    - 列出需要新增或更新头注释的关键文件
    - 评估对现有文档的一致性影响

  tasks:
    - 按模块分组，checkbox 格式
    - 单个 task 粒度控制在 30 分钟到 2 小时
    - 测试或验证任务放在实现后
    - 最后一组固定为"文档与分形同步"
    - 文档与分形同步必须覆盖 project.md、_DIR.md 与关键文件头注释

  verify:
    - apply 完成后、archive 之前必须执行 verify
    - 检查 completeness：tasks.md 全部勾选，delta specs 场景全覆盖
    - 检查 correctness：代码行为匹配 proposal intent
    - 检查 coherence：实际结构匹配 design.md 文件清单
    - 运行 test + lint + build 全量验证
    - 分形文档一致性检查（_DIR.md、头注释、project.md）

  archive:
    - 归档前必须通过 verify
    - 将 delta specs 合并到 openspec/specs/ 对应领域文件（sync）
    - ADDED 追加、MODIFIED 替换、REMOVED 删除
    - 移动 change 目录到 openspec/changes/archive/
    - 更新 openspec/changes/_DIR.md
    - 更新 product/backlog.md 对应条目阶段为 done

  logging:
    - 所有 STOP 和 WARN 级别问题必须记录到 .logs/[phase]/<artifact-id>.md（module-designer 用 M-NNN，prd 用 PRD-NNN，change 阶段用 change-id）
    - SKIP 级别（正常流程跳过）不记录
    - 日志格式包含：时间戳、类型、级别、现象、上下文、处理动作
    - 每个 artifact / change 一个日志文件，追加写入
    - 复盘检查点发现的路径偏离（范围/方案/一致性）也记录到同一文件
    - 一次性网络超时不记录，反复出现时记录
